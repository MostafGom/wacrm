name: Migrations

# Boot a clean Postgres 17 + pgvector and replay every migration, in
# order, from nothing — the same image docker-compose uses. Needs no
# secrets and no external services.

on:
  pull_request:
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'db/**'
      - 'scripts/migrate.mjs'
      - 'src/lib/db/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'scripts/migrate.mjs'
      - 'src/lib/db/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wacrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wacrm
      APP_DB_PASSWORD: ci-app-password
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wacrm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails on the first statement Postgres rejects.
      - name: Replay every migration from scratch
        run: npm run db:migrate

      # A second run must be a no-op.
      - name: Re-run is idempotent
        run: npm run db:migrate

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/ci/verify-schema.sql

      - name: Integration tests (adapter, RLS, auth, storage, realtime)
        run: npm run test:integration
